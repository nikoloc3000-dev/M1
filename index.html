<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки</title>
<meta name="theme-color" content="#2F6BFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--surface:#FFFFFF;--ink:#13202C;--muted:#6B7A89;--line:#DCE3EA;--accent:#2F6BFF;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--surface:#18232F;--ink:#EAF0F6;--muted:#8D9CAB;--line:#273544;--accent:#6D93FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1720;--surface:#18232F;--ink:#EAF0F6;--muted:#8D9CAB;--line:#273544;--accent:#6D93FF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;max-width:520px;width:100%;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h1{font-size:26px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week{margin-bottom:6px;text-align:center;font-size:13px;color:var(--muted)}
.cell{aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative;font-weight:500;font-size:15px}
.cell.empty{visibility:hidden}
.cell.has{border-color:transparent}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:currentColor}
.hint{color:var(--muted);font-size:14px;margin:14px 2px 0}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:14px 0;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
.big{font-size:72px;line-height:1;font-weight:700;letter-spacing:-.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.note{padding:12px 0;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
.note b{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px}
.note b i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
h2{font-size:17px;margin:0 0 6px}
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:20px;margin-bottom:14px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sw button,.sw label{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);position:relative;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.sw .sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:500}
.row input{width:22px;height:22px;accent-color:var(--accent)}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:12px;margin-bottom:14px}
.act{display:flex;gap:10px}
.act button{flex:1;padding:13px;border-radius:12px;font-weight:700;border:1px solid var(--line)}
.act .main{background:var(--accent);color:#fff;border-color:var(--accent);flex:2}
</style>
</head>
<body>
<main id="main"></main>
<nav class="tabs" aria-label="Разделы">
  <button id="t-cal" aria-current="true">Календарь</button>
  <button id="t-st">Статистика</button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var PALETTE=["#2F6BFF","#14B8A6","#22C55E","#F5B301","#FF7A45","#EF4444","#D946EF","#8B5CF6"];
var data={};
try{data=JSON.parse(localStorage.getItem("wk:v1")||"{}")}catch(e){data={}}
function persist(){try{localStorage.setItem("wk:v1",JSON.stringify(data))}catch(e){}}
var now=new Date(),view={y:now.getFullYear(),m:now.getMonth()},tab="cal",draft=null,editKey=null;
var main=document.getElementById("main"),scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
function pad(n){return n<10?"0"+n:""+n}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function ink(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?"#111":"#fff"}
function plural(n){var a=n%10,b=n%100;return (a==1&&b!=11)?"день":(a>=2&&a<=4&&(b<10||b>=20))?"дня":"дней"}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function shift(d){view.m+=d;if(view.m<0){view.m=11;view.y--}if(view.m>11){view.m=0;view.y++}render()}
function head(){
  var h=el("div","head"),t=el("h1",null,MONTHS[view.m]+" "+view.y),n=el("div","nav");
  var p=el("button",null,"‹"),x=el("button",null,"›");
  p.setAttribute("aria-label","Предыдущий месяц");x.setAttribute("aria-label","Следующий месяц");
  p.onclick=function(){shift(-1)};x.onclick=function(){shift(1)};
  n.append(p,x);h.append(t,n);return h;
}
function calendar(){
  var f=document.createDocumentFragment();f.append(head());
  var w=el("div","week");["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function(d){w.append(el("span",null,d))});f.append(w);
  var g=el("div","grid"),first=(new Date(view.y,view.m,1).getDay()+6)%7,days=new Date(view.y,view.m+1,0).getDate();
  for(var i=0;i<first;i++)g.append(el("div","cell empty"));
  for(var d=1;d<=days;d++){
    (function(d){
      var k=key(view.y,view.m,d),r=data[k],b=el("button","cell",d);
      if(r&&r.c){b.classList.add("has");b.style.background=r.c;b.style.color=ink(r.c)}
      if(r&&r.w){b.append(el("span","dot"))}
      if(d==now.getDate()&&view.m==now.getMonth()&&view.y==now.getFullYear())b.classList.add("today");
      b.setAttribute("aria-label",d+" "+GEN[view.m]);
      b.onclick=function(){openSheet(d)};g.append(b);
    })(d);
  }
  f.append(g);f.append(el("p","hint","Нажми на день, чтобы выбрать цвет и записать тренировку. Точка в углу значит, что тренировка была."));
  return f;
}
function stats(){
  var f=document.createDocumentFragment();f.append(head());
  var days=new Date(view.y,view.m+1,0).getDate(),cnt=0,notes=[];
  for(var d=1;d<=days;d++){var r=data[key(view.y,view.m,d)];if(r){if(r.w)cnt++;if(r.n)notes.push([d,r])}}
  var c=el("div","card");c.append(el("div","big",cnt));
  c.append(el("p",null,plural(cnt)+" с тренировкой из "+days));
  var bar=el("div","bar"),i=el("i");i.style.width=Math.round(cnt/days*100)+"%";bar.append(i);c.append(bar);f.append(c);
  var n=el("div","card");n.append(el("h2",null,"Заметки за месяц"));
  if(!notes.length){n.append(el("p","hint","Пока пусто. Открой день в календаре и добавь первую заметку."))}
  notes.reverse().forEach(function(x){
    var w=el("div","note"),b=el("b",null,x[0]+" "+GEN[view.m]),dot=el("i");
    if(x[1].c)dot.style.background=x[1].c;b.prepend(dot);w.append(b,el("p",null,x[1].n));n.append(w);
  });
  f.append(n);return f;
}
function render(){
  main.replaceChildren(tab=="cal"?calendar():stats());
  document.getElementById("t-cal").setAttribute("aria-current",tab=="cal");
  document.getElementById("t-st").setAttribute("aria-current",tab=="st");
}
document.getElementById("t-cal").onclick=function(){tab="cal";render()};
document.getElementById("t-st").onclick=function(){tab="st";render()};
function openSheet(d){
  editKey=key(view.y,view.m,d);var r=data[editKey]||{};
  draft={c:r.c||"",w:!!r.w,n:r.n||""};
  sheet.replaceChildren();
  sheet.append(el("h2",null,d+" "+GEN[view.m]));
  var sw=el("div","sw");
  function mark(){Array.prototype.forEach.call(sw.children,function(b){b.classList.toggle("sel",(b.dataset.c||"")==draft.c)})}
  var none=el("button",null,"∅");none.dataset.c="";none.setAttribute("aria-label","Без цвета");none.onclick=function(){draft.c="";mark()};sw.append(none);
  PALETTE.forEach(function(c){var b=el("button");b.style.background=c;b.style.borderColor=c;b.dataset.c=c;b.setAttribute("aria-label","Цвет "+c);b.onclick=function(){draft.c=c;mark()};sw.append(b)});
  var cu=el("label",null,"+"),inp=el("input");inp.type="color";inp.value=draft.c||"#2F6BFF";inp.oninput=function(){draft.c=inp.value.toUpperCase();mark()};
  cu.append(inp);cu.setAttribute("aria-label","Свой цвет");sw.append(cu);sheet.append(sw);mark();
  var row=el("label","row"),cb=el("input");cb.type="checkbox";cb.checked=draft.w;cb.onchange=function(){draft.w=cb.checked};
  row.append(cb,el("span",null,"Была тренировка"));sheet.append(row);
  var ta=el("textarea");ta.placeholder="Заметка: что делал, как прошло";ta.value=draft.n;ta.oninput=function(){draft.n=ta.value};sheet.append(ta);
  var act=el("div","act"),clr=el("button",null,"Очистить"),sv=el("button","main","Сохранить");
  clr.onclick=function(){delete data[editKey];persist();closeSheet()};
  sv.onclick=function(){
    var n=draft.n.trim();
    if(!draft.c&&!draft.w&&!n)delete data[editKey];else data[editKey]={c:draft.c,w:draft.w,n:n};
    persist();closeSheet();
  };
  act.append(clr,sv);sheet.append(act);scrim.classList.add("on");
}
function closeSheet(){scrim.classList.remove("on");render()}
scrim.addEventListener("click",function(e){if(e.target===scrim)closeSheet()});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
